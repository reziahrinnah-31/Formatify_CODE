<script>
  let uploadedDocxBuffer = null;
  let uploadedDocxHtml   = null;

  // ── Track whether parent has explicitly loaded a template ──
  // Until a LOAD_TEMPLATE message arrives, updatePreview() will NOT
  // post TEMPLATE_DATA up to the parent (avoids overwriting admin defaults on load).
  let templateLoadedByParent = false;

  window.addEventListener('message', async (event) => {
    if (!event.data) return;

    // ── 1. Parent uploads a .docx file for the practical content ──
    if (event.data.type === 'DOCX_FILE') {
      uploadedDocxBuffer = event.data.buffer;
      if (typeof updatePreview === 'function') {
        updatePreview();
      } else {
        window.addEventListener('load', () => updatePreview());
      }
    }

    // ── 2. Parent triggers DOCX download ──
    if (event.data.type === 'TRIGGER_DOCX') {
      if (typeof generateDOCX === 'function') {
        await generateDOCX();
      }
    }

    // ── 3. Parent requests current form values ──
    if (event.data.type === 'REQUEST_FORM_DATA') {
      window.parent.postMessage({
        type: 'TEMPLATE_DATA',
        payload: collectFormData()
      }, '*');
    }

    // ── 4. Parent restores previously saved form state ──
    if (event.data.type === 'RESTORE_FORM') {
      const d = event.data.data;
      if (!d) return;
      applyFormData(d);
      if (typeof updatePreview === 'function') updatePreview();
    }

    // ── 5. FIX: Parent loads a template (subject switch, e.g. ML → JAVA) ──
    // This was completely missing before — silently ignored all template loads.
    if (event.data.type === 'LOAD_TEMPLATE') {
      // Dashboard.jsx sends { type:'LOAD_TEMPLATE', template: obj }
      // Other callers may send payload or data — support all three
      const d = event.data.template || event.data.payload || event.data.data || {};
      templateLoadedByParent = true;
      applyFormData(d);
      if (typeof updatePreview === 'function') updatePreview();
      // Echo back so parent knows the iframe accepted the template
      window.parent.postMessage({
        type: 'TEMPLATE_DATA',
        payload: collectFormData()
      }, '*');
    }
  });

  // ── Collect all form values into one object ──
  function collectFormData() {
    return {
      studentName:    getValSafe('studentName'),
      regNo:          getValSafe('regNo'),
      instituteName:  getValSafe('instituteName'),   // FIX: was missing entirely
      subjectName:    getValSafe('subjectName'),
      courseCode:     getValSafe('courseCode'),
      semester:       getValSafe('semester'),
      academicYear:   getValSafe('academicYear'),
      tocContent:     getValSafe('tocContent'),
    };
  }

  // ── Apply a data object back onto the form fields ──
  function applyFormData(d) {
    const set = (id, val) => {
      const el = document.getElementById(id);
      if (el && val !== undefined && val !== null) el.value = val;
    };
    set('studentName',   d.studentName);
    set('regNo',         d.regNo);
    set('instituteName', d.instituteName);   // FIX: was missing entirely
    set('subjectName',   d.subjectName);
    set('courseCode',    d.courseCode);
    set('semester',      d.semester);
    set('academicYear',  d.academicYear);
    set('tocContent',    d.tocContent);
  }

  // Safe getValue that works before DOM is ready
  function getValSafe(id) {
    const el = document.getElementById(id);
    return el ? el.value.trim() : '';
  }
</script>

// PAGE BORDER XML
// ══════════════════════════════════════════════════════════════
const PAGE_BORDER_XML =
  '<w:pgBorders w:offsetFrom="page">' +
  '<w:top    w:val="thickThinMediumGap" w:color="000000" w:sz="20" w:space="20"/>' +
  '<w:left   w:val="thickThinMediumGap" w:color="000000" w:sz="20" w:space="20"/>' +
  '<w:bottom w:val="thickThinMediumGap" w:color="000000" w:sz="20" w:space="20"/>' +
  '<w:right  w:val="thickThinMediumGap" w:color="000000" w:sz="20" w:space="20"/>' +
  '</w:pgBorders>';

async function injectBordersIntoDocx(blob) {
  if (typeof JSZip === 'undefined') return blob;
  const zip = await JSZip.loadAsync(blob);
  const docXml = await zip.file('word/document.xml').async('string');
  let fixed = docXml.replace(/<w:pgBorders[^>]*>[\s\S]*?<\/w:pgBorders>/g, '');
  fixed = fixed.replace(/(<w:pgMar[^\/]*\/>)/g, '$1' + PAGE_BORDER_XML);
  fixed = fixed.replace(/<\/w:sectPr>/g, (match, offset) => {
    const window2 = fixed.substring(Math.max(0, offset - 400), offset);
    if (window2.includes('<w:pgBorders')) return match;
    return PAGE_BORDER_XML + match;
  });
  zip.file('word/document.xml', fixed);
  return await zip.generateAsync({
    type: 'blob',
    mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
    compression: 'DEFLATE'
  });
}

function getVal(id) { return document.getElementById(id).value.trim(); }

function parseTOC(text) {
  const lines = text.split("\n").filter(l => l.trim());
  const rows = [];
  let sl = 1;
  for (const line of lines) {
    const dm = line.match(/(\d{2}\.\d{2}\.\d{4})/);
    if (!dm) continue;
    const dateStr = dm[1];
    const rest = line.slice(line.indexOf(dateStr) + dateStr.length).trim();
    const pm = rest.match(/(\d+[-\u2013]\d+|\d+)\s*$/);
    const pageNo = pm ? pm[1] : "";
    const content = pm ? rest.slice(0, rest.lastIndexOf(pm[0])).trim() : rest;
    rows.push({ sl: String(sl++), date: dateStr, content, pageNo });
  }
  return rows;
}

/* ══════════════════════════════════════════════════════════════
   IMAGE UTILITIES
   ══════════════════════════════════════════════════════════════ */
function loadImageInfo(src) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const match = src.match(/^data:([^;]+);base64,(.+)$/);
      if (!match) { resolve(null); return; }
      const mimeType = match[1];
      const b64 = match[2];
      try {
        const binary = atob(b64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        const ext = mimeType.includes('png') ? 'png' : mimeType.includes('gif') ? 'gif' : 'jpg';
        resolve({ width: img.naturalWidth || img.width || 400, height: img.naturalHeight || img.height || 300, bytes, ext });
      } catch(e) { resolve(null); }
    };
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

/* ══════════════════════════════════════════════════════════════
   htmlToDocxParas — async, mammoth HTML → docx.js Paragraph array
   ══════════════════════════════════════════════════════════════ */
async function htmlToDocxParas(html, { S12, S14, S16, T, blank }) {
  const { Paragraph, TextRun, ImageRun, AlignmentType } = docx;
  const F = "Times New Roman";

  function sp(before=0, after=120, line=360) {
    return { before, after, line, lineRule: "auto" };
  }

  const parser = new DOMParser();
  const doc2   = parser.parseFromString('<div id="r">' + html + '</div>', 'text/html');
  const root   = doc2.getElementById('r');
  const paras  = [];
  let titleDone     = false;
  let toplevelCount = 0;
  const MAX_IMG_WIDTH_PT = 460;

  function buildTextChildren(line, sz) {
    return line
      .split(/(«[^»]*»)/g)
      .filter(seg => seg.length > 0)
      .map(seg => {
        if (seg.startsWith('«') && seg.endsWith('»')) {
          return new TextRun({ text: String(seg.slice(1,-1) ?? ''), bold:true, font:F, size:sz, color:"000000" });
        }
        return new TextRun({ text: String(seg ?? ''), font:F, size:sz, color:"000000" });
      });
  }

  async function processNode(node) {
    if (node.nodeName === 'IMG') {
      const src = node.getAttribute('src') || '';
      if (!src.startsWith('data:')) return;
      const info = await loadImageInfo(src);
      if (!info) { console.warn('[IMG] Could not load image info, skipping.'); return; }
      const ratio = Math.min(1, MAX_IMG_WIDTH_PT / info.width);
      const w = Math.round(info.width  * ratio);
      const h = Math.round(info.height * ratio);
      try {
        paras.push(new Paragraph({
          alignment: AlignmentType.CENTER,
          spacing:   sp(120, 120, 240),
          children:  [new ImageRun({ data: info.bytes, transformation: { width: w, height: h }, type: info.ext })],
        }));
      } catch(e) { console.warn('[IMG] Failed to create ImageRun:', e.message); }
      return;
    }

    if (node.nodeType === 1 && node.querySelector && node.querySelector('img')) {
      for (const child of Array.from(node.childNodes)) { await processNode(child); }
      return;
    }

    if (node.nodeType === 3) return;

    const text = (node.textContent || '').trim();
    if (!text) {
      if (node.childNodes) { for (const child of Array.from(node.childNodes)) { await processNode(child); } }
      return;
    }

    const innerHtml = node.innerHTML || '';
    const markedLine = innerHtml
      .replace(/<strong[^>]*>([\s\S]*?)<\/strong>/gi, (_, t) => `«${t.replace(/<[^>]+>/g,'')}»`)
      .replace(/<b[^>]*>([\s\S]*?)<\/b>/gi, (_, t) => `«${t.replace(/<[^>]+>/g,'')}»`)
      .replace(/<[^>]+>/g, '')
      .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&nbsp;/g,' ')
      .trim();

    if (!markedLine) return;

    const isToplevel   = /^\d+\.\s+\S/.test(text) && !/^\d+\.\d+/.test(text);
    const isSubheading = /^\d+\.\d+/.test(text);

    if (!titleDone) {
      titleDone = true;
      paras.push(new Paragraph({
        alignment: AlignmentType.CENTER,
        spacing:   sp(0, 200, 360),
        children:  [new TextRun({ text: String(markedLine ?? ''), bold:true, font:F, size:S16, color:"000000" })],
      }));
      return;
    }

    if (isToplevel) {
      toplevelCount++;
      paras.push(new Paragraph({
        alignment:       AlignmentType.LEFT,
        spacing:         sp(0, 160, 360),
        pageBreakBefore: toplevelCount > 1,
        children: [new TextRun({ text: String(markedLine ?? ''), bold:true, font:F, size:S14, color:"000000" })],
      }));
      return;
    }

    if (isSubheading) {
      paras.push(new Paragraph({
        alignment: AlignmentType.LEFT,
        spacing:   sp(120, 80, 360),
        children:  [new TextRun({ text: String(markedLine ?? ''), bold:true, font:F, size:S12, color:"000000" })],
      }));
      return;
    }

    paras.push(new Paragraph({
      alignment: AlignmentType.JUSTIFIED,
      spacing:   sp(0, 120, 360),
      children:  buildTextChildren(markedLine, S12),
    }));
  }

  for (const child of Array.from(root.childNodes)) { await processNode(child); }
  return paras;
}

/* ══════════════════════════════════════════════════════════════
   renderPaginatedDoc — paginated preview with image support
   ══════════════════════════════════════════════════════════════ */
function renderPaginatedDoc(html, reg, code, subj) {
  const oldWrap   = document.getElementById('uploadedPagesWrap');
  if (oldWrap) oldWrap.remove();
  const oldSingle = document.getElementById('uploadedDocPreview');
  if (oldSingle) oldSingle.remove();

  const previewArea = document.getElementById('previewArea');
  const wrap = document.createElement('div');
  wrap.id = 'uploadedPagesWrap';
  wrap.style.cssText = 'width:210mm;margin:0 auto;display:flex;flex-direction:column;gap:0;';
  previewArea.appendChild(wrap);

  const parser   = new DOMParser();
  const parsed   = parser.parseFromString('<div id="root">' + html + '</div>', 'text/html');
  const allNodes = Array.from(parsed.getElementById('root').childNodes);

  let PAGE_H = 870;
  try {
    const probe = document.createElement('div');
    probe.className = 'a4-doc-page';
    probe.style.cssText = 'position:absolute;visibility:hidden;pointer-events:none;top:-9999px;';
    probe.innerHTML = `
      <div class="outer-border"></div>
      <div class="inner-border"></div>
      <div class="doc-header-bar" style="margin:36px 42px 0 42px;padding:6px 4px;flex-shrink:0;"></div>
      <div class="page-content" id="_probe_content" style="flex:1;padding:12px 50px;box-sizing:border-box;"></div>
      <div class="doc-footer-bar" style="margin:0 42px 36px 42px;padding:6px 4px;flex-shrink:0;"></div>`;
    document.body.appendChild(probe);
    const contentEl = probe.querySelector('.page-content');
    if (contentEl) PAGE_H = contentEl.clientHeight || 870;
    document.body.removeChild(probe);
  } catch(_) {}

  PAGE_H = Math.max(800, PAGE_H - 8);
  const MIN_BREAK_H = 80;

  let pageNum          = 0;
  let currentContentEl = null;
  let usedH            = 0;
  let mainTitleFound   = false;

  function newPage() {
    pageNum++;
    const pn   = pageNum;
    const page = document.createElement('div');
    page.className = 'a4-doc-page';
    page.innerHTML = `
      <div class="outer-border"></div>
      <div class="inner-border"></div>
      <div class="doc-header-bar">
        <span style="font-weight:700;font-style:normal;">Kristu Jayanti (Deemed to be University)</span>
        <span style="font-weight:700;font-style:normal;">${code} - ${subj}</span>
      </div>
      <div class="page-content" id="pc-${pn}"></div>
      <div class="doc-footer-bar">
        <span style="font-weight:700;">${reg}</span>
        <span style="font-weight:700;">${pn}</span>
      </div>`;
    wrap.appendChild(page);
    currentContentEl = page.querySelector('.page-content');
    usedH = 0;
    return currentContentEl;
  }

  function classifyNode(node) {
    if (!node || node.nodeType !== 1) return 'body';
    if (node.nodeName === 'IMG') return 'image';
    if (node.querySelector && node.querySelector('img')) return 'image-container';
    const text = (node.textContent || '').trim();
    if (!text) return 'empty';
    if (/^\d+\.\s+\S/.test(text) && !/^\d+\.\d+/.test(text)) return 'toplevel';
    if (/^\d+\.\d+/.test(text)) return 'subheading';
    return 'body';
  }

  function stripUnderlines(el) {
    if (el.style) { el.style.textDecoration = 'none'; el.style.borderBottom = 'none'; el.style.border = 'none'; }
    el.querySelectorAll && el.querySelectorAll('u').forEach(u => {
      const span = document.createElement('span');
      span.innerHTML = u.innerHTML;
      u.replaceWith(span);
    });
    el.querySelectorAll && el.querySelectorAll('*').forEach(child => {
      if (child.style) { child.style.textDecoration = 'none'; child.style.borderBottom = 'none'; }
    });
  }

  function styleNode(node, classification) {
    const clone = node.cloneNode(true);
    stripUnderlines(clone);

    if (classification === 'image' || classification === 'image-container') {
      const imgs = clone.nodeName === 'IMG' ? [clone] : Array.from(clone.querySelectorAll('img'));
      imgs.forEach(img => {
        const src = img.getAttribute('src');
        if (src) img.src = src;
        img.style.cssText = 'max-width:100% !important;width:auto !important;height:auto !important;max-height:380px !important;display:block !important;margin:10px auto !important;object-fit:contain !important;';
        img.removeAttribute('width');
        img.removeAttribute('height');
      });
      if (clone.nodeName === 'IMG') {
        const wrapper = document.createElement('div');
        wrapper.style.cssText = 'text-align:center;margin:10px 0;';
        wrapper.appendChild(clone);
        return wrapper;
      }
      clone.style.cssText = 'text-align:center;margin:10px 0;display:block;';
      return clone;
    }

    const text = (clone.textContent || '').trim();

    if (!mainTitleFound && text) {
      mainTitleFound = true;
      clone.style.cssText = "text-align:center !important;font-size:16pt !important;font-weight:bold !important;font-family:'Times New Roman',serif;margin:0 0 12px 0;display:block;line-height:1.5;";
      clone.querySelectorAll('*').forEach(el => { el.style.fontWeight = 'bold'; });
      return clone;
    }

    if (classification === 'toplevel') {
      clone.style.cssText = "font-size:14pt !important;font-weight:bold !important;font-family:'Times New Roman',serif;margin:0 0 8px 0;display:block;line-height:1.5;";
      clone.querySelectorAll('*').forEach(el => { el.style.fontWeight = 'bold'; el.style.fontSize = '14pt'; });
      return clone;
    }

    if (classification === 'subheading') {
      clone.style.cssText = "font-size:12pt !important;font-weight:bold !important;font-family:'Times New Roman',serif;margin:6px 0 4px 0;display:block;line-height:1.5;";
      clone.querySelectorAll('*').forEach(el => { el.style.fontWeight = 'bold'; });
      return clone;
    }

    const boldKids  = clone.querySelectorAll ? Array.from(clone.querySelectorAll('strong, b')) : [];
    const directTxt = clone.childNodes ? Array.from(clone.childNodes).filter(n => n.nodeType === 3 && n.textContent.trim()).length : 0;
    if (boldKids.length > 0 && directTxt === 0 && boldKids[0].textContent.trim() === text) {
      clone.style.cssText = "font-size:12pt !important;font-weight:bold !important;font-family:'Times New Roman',serif;margin:6px 0 2px 0;display:block;line-height:1.5;";
      clone.querySelectorAll('*').forEach(el => { el.style.fontWeight = 'bold'; });
      return clone;
    }

    clone.style.cssText = "font-size:12pt;line-height:1.5;font-family:'Times New Roman',serif;margin:0 0 6px 0;text-align:justify;color:#000;display:block;";
    return clone;
  }

  function measureHeight(nodeClone) {
    const ruler = document.createElement('div');
    ruler.style.cssText = "position:absolute;visibility:hidden;pointer-events:none;width:calc(210mm - 100px);top:0;left:-9999px;font-family:'Times New Roman',serif;font-size:12pt;line-height:1.5;box-sizing:border-box;";
    document.body.appendChild(ruler);
    const cloned = nodeClone.cloneNode(true);
    cloned.querySelectorAll && cloned.querySelectorAll('img').forEach(img => {
      const src = img.getAttribute('src');
      if (src) img.src = src;
      img.style.cssText = 'max-width:100%;width:auto;height:auto;max-height:380px;display:block;';
    });
    ruler.appendChild(cloned);
    const h = ruler.scrollHeight || ruler.offsetHeight || 20;
    document.body.removeChild(ruler);
    return Math.max(h, 20);
  }

  newPage();

  for (const node of allNodes) {
    if (node.nodeType === 3 && !node.textContent.trim()) continue;
    if (node.nodeType === 1 && !(node.textContent || '').trim()
        && !(node.nodeName === 'IMG') && !(node.querySelector && node.querySelector('img'))) continue;

    const cls = classifyNode(node);
    if (cls === 'empty') continue;

    if (cls === 'toplevel') {
      if (usedH > MIN_BREAK_H) newPage();
      const styled = styleNode(node, cls);
      currentContentEl.appendChild(styled);
      usedH += measureHeight(styled);
      continue;
    }

    const styled = styleNode(node, cls);
    const h      = measureHeight(styled);
    const breakThreshold = (cls === 'image' || cls === 'image-container') ? PAGE_H * 0.6 : PAGE_H;
    if (usedH + h > breakThreshold && usedH > 10) newPage();
    currentContentEl.appendChild(styled);
    usedH += h;
  }
}

// ── Boot ──
window.__kjReady = true;
updatePreview();
</script>
